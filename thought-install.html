<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>thought of</title>
<style>
html,body{margin:0;min-height:100%;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}
.wordmark{font-size:44px;font-weight:300;letter-spacing:-2px;margin:0 0 14px}
p{margin:0;color:#777;font-size:16px;line-height:1.45;max-width:320px}
</style>
</head>
<body>
<main><div><div class="wordmark">thought of</div><p>Add this page to your Home Screen, then open it from there.</p></div></main>
<script>
(async()=>{
  const standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  if(standalone){
    location.replace('thought-profile-ios11.html?from=install');
    return;
  }
  if('serviceWorker' in navigator){
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){
        if((reg.scope||'').includes('/thought-of-site/')) await reg.unregister();
      }
    }catch(e){}
  }
})();
</script>
</body>
</html>
