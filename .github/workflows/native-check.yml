name: Native app check

on:
  push:
    branches: [native-app]
    paths:
      - 'native/**'
      - '.github/workflows/native-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency versions
        run: npx expo install --check
      - name: TypeScript
        run: npm run typecheck
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Bundle iOS app
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://dlaxhooizwxitjxcjyyf.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_cnNOjkZ1yi5uAPdFv8SDJQ_i_HwSAbA
        run: npx expo export --platform ios --output-dir /tmp/thought-of-ios-export
