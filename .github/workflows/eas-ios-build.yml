name: Build native iOS app

on:
  workflow_dispatch:
  push:
    branches:
      - native-app
    paths:
      - native/eas-ios-build-trigger.txt

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v5
        with:
          ref: native-app
      - name: Require Expo token
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "Add the EXPO_TOKEN repository secret first."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build iOS production app
        run: eas build --platform ios --profile production --non-interactive --wait
