<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thought Of Reach Out</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{border:0;width:100%;height:100dvh;display:block}</style></head><body><iframe id="thoughtApp" src="thought-profile-ios6.html?v=reachout1"></iframe><script>
const frame=document.getElementById('thoughtApp');
frame.addEventListener('load',()=>setTimeout(injectReachOut,500));
function injectReachOut(){let d=frame.contentDocument;if(!d||!d.getElementById('history')){setTimeout(injectReachOut,400);return}if(d.getElementById('reachOut'))return;
let style=d.createElement('style');style.textContent='.reach-btn{padding:10px 12px;white-space:nowrap}.reach-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:90;display:flex;align-items:flex-end;justify-content:center}.reach-sheet{width:min(480px,100%);background:#fff;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.10)}.reach-sheet h2{margin:0 0 6px;font-size:22px}.reach-sheet p{margin:0 0 16px}.reach-option{width:100%;margin-top:9px;background:#f3f3f3;color:#111;text-align:left;font-size:17px}.wa-setting{display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid #eee;margin-top:16px;padding-top:16px}.wa-setting input{width:auto!important;transform:scale(1.25)}.wa-copy{flex:1}.wa-copy b{display:block;margin-bottom:3px}';d.head.appendChild(style);
let top=d.querySelector('#history .topbar'),reach=d.createElement('button');reach.id='reachOut';reach.className='secondary reach-btn';reach.textContent='Reach Out';top.insertBefore(reach,top.children[1]);
let avatar=d.querySelector('#account .avatar-section'),wa=d.createElement('div');wa.className='wa-setting';wa.innerHTML='<div class="wa-copy"><b>WhatsApp Reach Out</b><span class="muted">Let your People reach you on WhatsApp.</span></div><input id="whatsappEnabled" type="checkbox" aria-label="Enable WhatsApp Reach Out">';avatar.appendChild(wa);
let s=d.createElement('script');s.textContent=`
(async()=>{let toggle=document.getElementById('whatsappEnabled');try{toggle.checked=!!me.profile?.whatsapp_enabled}catch(e){}
toggle.onchange=async e=>{let enabled=e.target.checked;try{let x=await api('/rest/v1/profiles?id=eq.'+me.id,{method:'PATCH',headers:{Prefer:'return=representation'},body:{whatsapp_enabled:enabled}});me.profile=x[0]||{...me.profile,whatsapp_enabled:enabled}}catch(err){e.target.checked=!enabled;alert(err.message)}};
document.getElementById('reachOut').onclick=async()=>{if(!currentPerson)return;let btn=document.getElementById('reachOut');btn.disabled=true;try{let x=await api('/rest/v1/rpc/get_connected_person_contact',{method:'POST',body:{p_target_user_id:currentPerson.id}}),c=x[0];if(!c?.phone)throw Error('Reach Out is unavailable for this person.');let back=document.createElement('div');back.className='reach-backdrop';let sheet=document.createElement('div');sheet.className='reach-sheet';let h=document.createElement('h2');h.textContent='Reach Out';let p=document.createElement('p');p.className='muted';p.textContent='Continue the conversation with '+(currentPerson.display_name||'your person')+'.';let text=document.createElement('button');text.className='reach-option';text.textContent='Text / iMessage';text.onclick=()=>{window.top.location.href='sms:'+c.phone};sheet.append(h,p,text);if(c.whatsapp_enabled){let w=document.createElement('button');w.className='reach-option';w.textContent='WhatsApp';w.onclick=()=>{window.top.location.href='https://wa.me/'+c.phone.replace(/\\D/g,'')};sheet.appendChild(w)}let cancel=document.createElement('button');cancel.className='secondary full';cancel.textContent='Cancel';cancel.onclick=()=>back.remove();sheet.appendChild(cancel);back.appendChild(sheet);back.onclick=e=>{if(e.target===back)back.remove()};document.body.appendChild(back)}catch(err){alert(err.message)}finally{btn.disabled=false}};
})();`;d.body.appendChild(s)}
</script></body></html>
