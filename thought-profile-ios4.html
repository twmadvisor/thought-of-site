<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thought Of Reactions Test</title><style>html,body{margin:0;min-height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#loading{padding:40px;text-align:center;color:#777}</style></head><body><div id="loading">Loading Thought Of…</div><script>
(async()=>{try{let t=await fetch('thought-profile.html?v=reactions2-'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Could not load app');return r.text()});
const oldStorage="async function storageBlob(path){let r=await fetch(URL+'/storage/v1/object/avatars/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+token}});if(!r.ok)throw Error('Photo unavailable');let u=URL.createObjectURL(await r.blob());blobUrls.push(u);return u}";
const newStorage="function blobToDataURL(blob){return new Promise((resolve,reject)=>{let fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>reject(Error('Could not read photo'));fr.readAsDataURL(blob)})}async function storageBlob(path){let r=await fetch(URL+'/storage/v1/object/avatars/'+path+'?v='+Date.now(),{cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+token,'Cache-Control':'no-cache'}});if(!r.ok)throw Error('Photo unavailable');return await blobToDataURL(await r.blob())}";
const oldCrop="function cropSquare(file){return new Promise((resolve,reject)=>{let img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let s=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-s)/2,sy=(img.naturalHeight-s)/2,c=document.createElement('canvas');c.width=c.height=512;c.getContext('2d').drawImage(img,sx,sy,s,s,0,0,512,512);URL.revokeObjectURL(u);c.toBlob(b=>b?resolve(b):reject(Error('Could not prepare photo')),'image/jpeg',.86)};img.onerror=()=>reject(Error('Could not read photo'));img.src=u})}";
const newCrop="function cropSquare(file){return new Promise((resolve,reject)=>{let fr=new FileReader();fr.onerror=()=>reject(Error('Could not read photo'));fr.onload=()=>{let img=new Image();img.onload=()=>{let s=Math.min(img.naturalWidth,img.naturalHeight),sx=(img.naturalWidth-s)/2,sy=(img.naturalHeight-s)/2,c=document.createElement('canvas');c.width=c.height=512;c.getContext('2d').drawImage(img,sx,sy,s,s,0,0,512,512);c.toBlob(b=>b?resolve(b):reject(Error('Could not prepare photo')),'image/jpeg',.86)};img.onerror=()=>reject(Error('Could not read photo'));img.src=fr.result};fr.readAsDataURL(file)})}";
const oldAvatarSave="await saveProfile({avatar_path:path});";
const newAvatarSave="let pd=await api('/rest/v1/profiles?id=eq.'+me.id,{method:'PATCH',headers:{Prefer:'return=representation','Cache-Control':'no-cache'},body:{avatar_path:path}});me.profile=pd[0]||{...me.profile,avatar_path:path};";
t=t.replace(oldStorage,newStorage).replace(oldCrop,newCrop).replace(oldAvatarSave,newAvatarSave);
t=t.replace(/path=me\.id\+'\/avatar\.jpg'/g,"path=me.id+'/avatar-'+Date.now()+'.jpg'");
t=t.replace("let r=await fetch(URL+path,{method:o.method||'GET'","let r=await fetch(URL+path,{cache:'no-store',method:o.method||'GET'");
t=t.replace("blobUrls.forEach(URL.revokeObjectURL);","");
const reactionCss=`
.bubble{cursor:pointer}.reaction-strip{display:flex;gap:4px;margin-top:13px;align-items:center}.thought-row.mine .reaction-strip,.thought-row.mine .reaction-picker{justify-content:flex-end}.thought-row.theirs .reaction-strip,.thought-row.theirs .reaction-picker{justify-content:flex-start}.reaction-chip{display:inline-flex;align-items:center;justify-content:center;min-width:31px;height:27px;padding:1px 7px;border:1px solid #ddd;border-radius:14px;background:#fff;color:#111;font-size:17px;font-weight:400;line-height:1}.reaction-chip.mine-reaction{background:#f2f2f2;border-color:#aaa}.reaction-count{font-size:11px;margin-left:2px;color:#666}.reaction-picker{display:flex;gap:5px;margin-top:13px;padding:6px 7px;border:1px solid #e4e4e4;border-radius:20px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.08);width:max-content;max-width:100%}.reaction-picker button{width:37px;height:37px;padding:0;border-radius:50%;background:#fff;color:#111;font-size:21px;font-weight:400}.reaction-picker button.selected{background:#ededed}`;
t=t.replace('</style>',reactionCss+'\n</style>');
const reactionBlock=`async function loadThoughts(){let b=$('thoughtList');b.innerHTML='<div class="empty">Loading…</div>';try{let ts=await api('/rest/v1/thoughts?connection_id=eq.'+currentConnection.id+'&select=id,sender_id,body,created_at&order=created_at.asc'),rs=[];if(ts.length)rs=await api('/rest/v1/reactions?thought_id=in.('+ts.map(x=>x.id).join(',')+')&select=thought_id,user_id,emoji,created_at');let rmap={};rs.forEach(r=>(rmap[r.thought_id]||(rmap[r.thought_id]=[])).push(r));b.innerHTML='';if(!ts.length){b.innerHTML='<div class="empty">No Thoughts yet.</div>';return}ts.forEach(x=>renderThought(x,rmap[x.id]||[]))}catch(e){b.innerHTML='<p class="error">'+e.message+'</p>'}}
function groupedReactions(rs){let m={};rs.forEach(r=>{let k=r.emoji;(m[k]||(m[k]={emoji:k,count:0,mine:false})).count++;if(r.user_id===me.id)m[k].mine=true});return Object.values(m)}
function closeReactionPickers(except){document.querySelectorAll('.reaction-picker').forEach(x=>{if(x!==except)x.remove()})}
async function setReaction(thoughtId,emoji){try{let existing=await api('/rest/v1/reactions?thought_id=eq.'+thoughtId+'&user_id=eq.'+me.id+'&select=emoji');if(existing[0]?.emoji===emoji){await api('/rest/v1/reactions?thought_id=eq.'+thoughtId+'&user_id=eq.'+me.id,{method:'DELETE',headers:{Prefer:'return=minimal'}})}else{await api('/rest/v1/reactions?on_conflict=thought_id,user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:{thought_id:thoughtId,user_id:me.id,emoji}})}await loadThoughts()}catch(e){message('historyMsg',e.message)}}
function openReactionPicker(row,t,rs){let existing=row.querySelector('.reaction-picker');if(existing){existing.remove();return}closeReactionPickers();let mine=rs.find(r=>r.user_id===me.id)?.emoji||'',p=document.createElement('div');p.className='reaction-picker';['❤️','👍','😂','😮','😢','🙌'].forEach(em=>{let bt=document.createElement('button');bt.type='button';bt.textContent=em;bt.setAttribute('aria-label','React '+em);if(mine===em)bt.classList.add('selected');bt.onclick=e=>{e.stopPropagation();setReaction(t.id,em)};p.appendChild(bt)});let strip=row.querySelector('.reaction-strip');if(strip)strip.after(p);else row.querySelector('.bubble').after(p)}
function renderThought(t,rs=[]){let b=$('thoughtList'),empty=b.querySelector('.empty');if(empty)empty.remove();let row=document.createElement('div');row.className='thought-row '+(t.sender_id===me.id?'mine':'theirs');let bubble=document.createElement('div'),s=shape(t.id);bubble.className='bubble';bubble.style.borderRadius=s.radius;row.style.setProperty('--tail1',s.t1+'px');row.style.setProperty('--tail2',s.t2+'px');row.style.setProperty('--tailx1',s.x1+'px');row.style.setProperty('--tailx2',s.x2+'px');bubble.textContent=t.body;bubble.onclick=e=>{e.stopPropagation();openReactionPicker(row,t,rs)};row.appendChild(bubble);let groups=groupedReactions(rs);if(groups.length){let strip=document.createElement('div');strip.className='reaction-strip';groups.forEach(g=>{let ch=document.createElement('button');ch.type='button';ch.className='reaction-chip'+(g.mine?' mine-reaction':'');let em=document.createElement('span');em.textContent=g.emoji;ch.appendChild(em);if(g.count>1){let ct=document.createElement('span');ct.className='reaction-count';ct.textContent=g.count;ch.appendChild(ct)}ch.onclick=e=>{e.stopPropagation();openReactionPicker(row,t,rs)};strip.appendChild(ch)});row.appendChild(strip)}if(t.sender_id===me.id){let age=Date.now()-new Date(t.created_at).getTime();if(age<10000){let r=document.createElement('button');r.className='rethink';r.textContent='Rethink';r.onclick=()=>rethink(t.id,row);row.appendChild(r);rethinkTimers[t.id]=setTimeout(()=>{r.remove();delete rethinkTimers[t.id]},10000-age)}}b.appendChild(row);window.scrollTo(0,document.body.scrollHeight)}`;
const re=/async function loadThoughts\(\)\{[\s\S]*?\}\nfunction renderThought\(t\)\{[\s\S]*?\}\$\('thoughtInput'\)\.oninput=/;
if(!re.test(t))throw Error('Reaction patch did not match current app');
t=t.replace(re,reactionBlock+"\n$('thoughtInput').oninput=");
t=t.replace("if(d[0])renderThought(d[0])","if(d[0])renderThought(d[0],[])");
document.open();document.write(t);document.close()}catch(e){document.getElementById('loading').textContent=e.message}})();
</script></body></html>
