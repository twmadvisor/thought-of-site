<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thought Of Test</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111;background:#fff}.wrap{max-width:480px;margin:auto;min-height:100vh;padding:28px 22px 90px}.brand{text-align:center;font-size:35px;font-weight:300;letter-spacing:-1.4px;margin:10px 0 32px}h1{font-size:27px;font-weight:500;margin:0 0 18px}input{width:100%;font:inherit;font-size:17px;padding:14px;border:1px solid #ccc;border-radius:14px;outline:none}button{border:0;border-radius:14px;padding:14px;font:inherit;font-weight:600;background:#111;color:#fff}.full{width:100%;margin-top:12px}.secondary{background:#f3f3f3;color:#111}.link{background:none;color:#111;text-decoration:underline}.note,.muted{color:#777;font-size:14px;line-height:1.4}.center{text-align:center}.error{color:#a00;text-align:center}.card{border:1px solid #e4e4e4;border-radius:18px;padding:16px;margin:12px 0}.topbar{display:flex;justify-content:space-between;align-items:center}.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:flex}.tab{flex:1;background:none;color:#777;padding:9px 2px}.tab.active{color:#111}.empty{text-align:center;color:#777;padding:45px 10px}[hidden]{display:none!important}</style></head>
<body><div class="wrap"><div class="brand">thought of</div>
<section id="auth"><div id="phoneStep"><h1>Your phone number</h1><input id="phone" type="tel" inputmode="tel" placeholder="+1 512 555 1234"><button id="sendCode" class="full">Send code</button><p class="note center">Use a Supabase test phone number while we’re developing.</p></div><div id="codeStep" hidden><h1>Enter your code</h1><p id="testing" class="muted"></p><input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit code"><button id="verifyCode" class="full">Continue</button></div><p id="authMsg" class="error" hidden></p></section>
<section id="profile" hidden><h1>What should your People call you?</h1><input id="name" maxlength="40" placeholder="Your name"><button id="saveName" class="full">Continue</button><p id="profileMsg" class="error" hidden></p></section>
<section id="app" hidden><div id="people" class="screen"><div class="topbar"><h1>Your People</h1><button class="secondary" onclick="screen('add')">＋</button></div><div id="peopleList"></div></div><div id="requests" class="screen" hidden><div class="topbar"><h1>Requests</h1><button class="secondary" onclick="loadRequests()">↻</button></div><div id="requestsList"></div></div><div id="add" class="screen" hidden><h1>Add someone</h1><p class="muted">Enter their exact phone number. We never import your contacts.</p><input id="addPhone" type="tel" inputmode="tel" placeholder="+1 512 555 1234"><button id="requestBtn" class="full">Send request</button><div id="requestDone" hidden><p class="center">Request sent.</p><button id="textThem" class="secondary full">Text them</button></div><p id="addMsg" class="error" hidden></p></div><div id="account" class="screen" hidden><h1>Account</h1><div class="card"><div id="accountName"></div><div id="accountPhone" class="muted"></div></div><button id="logout" class="secondary full">Log out</button></div></section>
</div><nav id="tabs" class="tabs" hidden><button class="tab active" data-s="people">People</button><button class="tab" data-s="requests">Requests</button><button class="tab" data-s="add">Add</button><button class="tab" data-s="account">Account</button></nav>
<script>
const URL='https://dlaxhooizwxitjxcjyyf.supabase.co',KEY='sb_publishable_cnNOjkZ1yi5uAPdFv8SDJQ_i_HwSAbA';let token=localStorage.getItem('thoughtof_token')||'',me=null,loginPhone='';const $=x=>document.getElementById(x);function norm(v){let t=v.trim(),d=t.replace(/\D/g,'');if(t[0]==='+')return'+'+d;if(d.length===10)return'+1'+d;if(d.length===11&&d[0]==='1')return'+'+d;return t}function message(id,t){let e=$(id);e.textContent=t||'';e.hidden=!t}async function api(path,o={}){let h={apikey:KEY,'Content-Type':'application/json'};if(o.auth!==false&&token)h.Authorization='Bearer '+token;let r=await fetch(URL+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined}),d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.msg||d.message||d.error||('Request failed '+r.status));return d}async function fn(n,b={}){return api('/functions/v1/'+n,{method:'POST',body:b})}
function authOnly(){ $('auth').hidden=false;$('profile').hidden=true;$('app').hidden=true;$('tabs').hidden=true }function appOnly(){ $('auth').hidden=true;$('profile').hidden=true;$('app').hidden=false;$('tabs').hidden=false;$('accountName').textContent=me.profile?.display_name||'';$('accountPhone').textContent=me.phone||'';screen('people') }
async function boot(){if(!token){authOnly();return}try{me=await api('/auth/v1/user');let p=await api('/rest/v1/profiles?id=eq.'+me.id+'&select=*');if(!p[0]?.display_name){$('auth').hidden=true;$('profile').hidden=false;$('app').hidden=true;$('tabs').hidden=true;return}me.profile=p[0];appOnly();await Promise.all([loadPeople(),loadRequests()])}catch(e){token='';localStorage.removeItem('thoughtof_token');authOnly()}}
$('sendCode').onclick=async()=>{loginPhone=norm($('phone').value);message('authMsg','');try{await api('/auth/v1/otp',{method:'POST',auth:false,body:{phone:loginPhone}});$('phoneStep').hidden=true;$('codeStep').hidden=false;$('testing').textContent='Testing '+loginPhone}catch(e){message('authMsg',e.message)}};
$('verifyCode').onclick=async()=>{try{let d=await api('/auth/v1/verify',{method:'POST',auth:false,body:{type:'sms',phone:loginPhone,token:$('code').value.trim()}});token=d.access_token;localStorage.setItem('thoughtof_token',token);await boot()}catch(e){message('authMsg',e.message)}};
$('saveName').onclick=async()=>{let n=$('name').value.trim();if(!n)return;try{let d=await api('/rest/v1/profiles?on_conflict=id',{method:'POST',body:{id:me.id,display_name:n}});await boot()}catch(e){message('profileMsg',e.message)}};
function screen(n){if(!token||!me)return;document.querySelectorAll('.screen').forEach(x=>x.hidden=true);$(n).hidden=false;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.s===n));if(n==='people')loadPeople();if(n==='requests')loadRequests()}window.screen=screen;document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>screen(x.dataset.s));
async function loadPeople(){if(!me)return;let b=$('peopleList');b.innerHTML='<div class="empty">Loading…</div>';try{let cs=await api('/rest/v1/connections?status=eq.active&or=(user_a.eq.'+me.id+',user_b.eq.'+me.id+')&select=*');if(!cs.length){b.innerHTML='<div class="empty">No People yet.</div>';return}let ids=cs.map(c=>c.user_a===me.id?c.user_b:c.user_a),ps=await api('/rest/v1/profiles?id=in.('+ids.join(',')+')&select=id,display_name'),map=Object.fromEntries(ps.map(p=>[p.id,p]));b.innerHTML='';cs.forEach(c=>{let id=c.user_a===me.id?c.user_b:c.user_a,p=map[id]||{display_name:'Person'},d=document.createElement('div');d.className='card';d.textContent=p.display_name||'Person';b.appendChild(d)})}catch(e){b.innerHTML='<p class="error">'+e.message+'</p>'}}
async function loadRequests(){if(!token||!me)return;let b=$('requestsList');try{let d=await fn('incoming-person-requests'),rs=d.requests||[];if(!rs.length){b.innerHTML='<div class="empty">No requests.</div>';return}b.innerHTML='';rs.forEach(r=>{let id=r.request_id||r.id,n=r.requester_display_name||r.display_name||'Someone',c=document.createElement('div');c.className='card';c.innerHTML='<b></b><p class="muted">wants to be one of your People.</p><button class="accept">Accept</button> <button class="secondary later">Not now</button>';c.querySelector('b').textContent=n;c.querySelector('.accept').onclick=()=>respond(id,'accept',n);c.querySelector('.later').onclick=()=>respond(id,'not_now',n);b.appendChild(c)})}catch(e){b.innerHTML='<p class="error">'+e.message+'</p>'}}window.loadRequests=loadRequests;async function respond(id,a,n){try{await fn('respond-person-request',{request_id:id,action:a});if(a==='accept')alert(n+' has been added to your People.');await Promise.all([loadPeople(),loadRequests()])}catch(e){alert(e.message)}}
$('requestBtn').onclick=async()=>{let p=norm($('addPhone').value);message('addMsg','');try{await fn('request-person',{phone:p});$('requestDone').hidden=false;$('textThem').onclick=()=>location.href='sms:'+p+'?&body='+encodeURIComponent('I’m using Thought Of to stay a little closer between conversations. Join me: https://twmadvisor.github.io/thought-of-site/')}catch(e){message('addMsg',e.message)}};$('logout').onclick=()=>{token='';me=null;localStorage.removeItem('thoughtof_token');location.reload()};boot();
</script></body></html>
