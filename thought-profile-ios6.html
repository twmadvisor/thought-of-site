<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thought Of Emoji Picker</title><style>html,body{margin:0;min-height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#loading{padding:40px;text-align:center;color:#777}</style></head><body><div id="loading">Loading Thought Of…</div><script>
(async()=>{try{let t=await fetch('thought-profile-ios5.html?v=picker1-'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Could not load app');return r.text()});
const old="let raw=prompt('Choose any emoji from your keyboard');if(!raw)return;let em=raw.trim();if(!em)return;try{if(typeof Intl!=='undefined'&&Intl.Segmenter){let parts=[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(em)];em=parts[0]?.segment||''}}catch(x){}if(em)setReaction(t.id,em)";
const neu="document.querySelectorAll('.full-emoji-wrap').forEach(x=>x.remove());import('https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js').then(()=>{let wrap=document.createElement('div');wrap.className='full-emoji-wrap';wrap.style.marginTop='8px';wrap.style.width='min(340px,90vw)';wrap.style.maxWidth='100%';let picker=document.createElement('emoji-picker');picker.style.width='100%';picker.style.height='360px';picker.addEventListener('emoji-click',ev=>{let em=ev.detail?.unicode;if(em){setReaction(t.id,em);wrap.remove()}});wrap.appendChild(picker);p.after(wrap)}).catch(()=>alert('Could not load emoji picker.'))";
if(!t.includes(old))throw Error('Full emoji picker patch did not match current build');t=t.replace(old,neu);
document.open();document.write(t);document.close()}catch(e){document.getElementById('loading').textContent=e.message}})();
</script></body></html>
